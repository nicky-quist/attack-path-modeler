name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Install the CPU-only torch wheel first. A plain `pip install -r
      # requirements.txt` resolves the CUDA build, which is several GB and
      # useless on a runner with no GPU. Once torch is present, pip treats the
      # requirement as satisfied and leaves it alone.
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: pip install -r requirements.txt

      # Test-only. src/stats.py is deliberately dependency-free, and
      # tests/test_stats.py checks it against scikit-learn's average precision
      # and scipy's binomial test. Without these the cross-checks skip, so
      # install them where it counts.
      - name: Install reference implementations for metric cross-checks
        run: pip install scikit-learn scipy

      # The suite makes no network calls. The tests build synthetic estates
      # with annotate_hosts(offline=True), whose fabricated CVEs fall back to
      # the CVSS-derived estimate, so no NVD, EPSS or KEV lookup is attempted.
      # (The data/ caches are gitignored and absent on the runner.) Verified by
      # running the suite in a clean checkout with sockets blocked.
      # test_leakage.py holds the regressions for the label-leakage bug;
      # test_models.py asserts the ablation study's GCN is the published model.
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
