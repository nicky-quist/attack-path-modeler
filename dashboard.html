<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attack Path Modeler</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { background: #1a1a2e; margin: 0; font-family: Arial, sans-serif; color: white; }
    h1 { text-align: center; padding: 20px 0 0; font-size: 22px; color: #e0e0e0; }
    p  { text-align: center; color: #888; margin: 4px 0 10px; font-size: 13px; }
    .node circle { stroke: #fff; stroke-width: 1.5px; cursor: pointer; }
    .node text   { font-size: 11px; fill: white; pointer-events: none; }
    .node .node-label {
      font-size: 12px;
      text-shadow: 0 1px 3px #000, 0 0 5px #000;
    }
    #tooltip {
      position: absolute;
      background: #2a2a4a;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 10px;
      font-size: 12px;
      pointer-events: none;
      display: none;
      max-width: 240px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>Attack Path Graph</h1>
  <p id="source-label">Hover over nodes and edges for details &nbsp;|&nbsp; Drag nodes to rearrange</p>
  <p style="text-align:center; margin-top:-4px;"><a href="builder.html" style="color:#7ec4ff; font-size:12px;">+ Build a new graph from known CVEs</a></p>
  <div id="tooltip"></div>
  <svg id="graph"></svg>

<script>
const width  = window.innerWidth;
const height = window.innerHeight - 80;

const svg = d3.select("#graph")
  .attr("width", width)
  .attr("height", height);

svg.append("defs").append("marker")
  .attr("id", "arrow")
  .attr("viewBox", "0 -5 10 10")
  .attr("refX", 10).attr("refY", 0)
  .attr("markerWidth", 3.5).attr("markerHeight", 3.5)
  .attr("orient", "auto")
  .append("path")
  .attr("d", "M0,-5L10,0L0,5")
  .attr("fill", "#aaa");

svg.append("defs").append("marker")
  .attr("id", "arrow-red")
  .attr("viewBox", "0 -5 10 10")
  .attr("refX", 10).attr("refY", 0)
  .attr("markerWidth", 3.5).attr("markerHeight", 3.5)
  .attr("orient", "auto")
  .append("path")
  .attr("d", "M0,-5L10,0L0,5")
  .attr("fill", "red");

const color = d3.scaleSequential()
  .domain([0, 10])
  .interpolator(d3.interpolateRdYlGn)
  .clamp(true);

// Colour by probability of exploitation, not severity: the whole point of the
// EPSS/KEV work is that these rank hosts differently.
const riskColor = p => color(10 - (p || 0) * 10);
const tooltip = d3.select("#tooltip");

// Escape untrusted strings before they go into tooltip .html() — hostnames, CVE IDs,
// services and ports here all ultimately trace back to what someone typed into
// builder.html or a known_hosts.json spec, so they can't be trusted as raw HTML.
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

d3.json("data/graph.json").then(data => {

  // Highest-risk path is computed server-side (src/analysis.py) and shipped
  // in the export — not hardcoded, so this works for any topology, not just
  // the original demo dataset.
  const riskNodeIds = data.riskPath || [];
  const riskLayer = svg.append("g").attr("id", "risk-path");

  // Pairs of nodes the red risk-path line already covers — skip the plain gray
  // line for these (in *either* direction) so a connection doesn't render
  // twice. A bidirectional pair (e.g. two hosts both marked as gateways) has
  // separate forward/reverse edges in the data, so this needs to be treated
  // as undirected or the reverse-direction gray line would still show up
  // right alongside the red one.
  const riskEdgeKeys = new Set();
  for (let i = 0; i < riskNodeIds.length - 1; i++) {
    riskEdgeKeys.add(`${riskNodeIds[i]}->${riskNodeIds[i + 1]}`);
    riskEdgeKeys.add(`${riskNodeIds[i + 1]}->${riskNodeIds[i]}`);
  }
  const idOf = v => (v && typeof v === "object") ? v.id : v;

  if (data.sourceLabel) {
    const when = data.generatedAt ? new Date(data.generatedAt).toLocaleString() : "";
    d3.select("#source-label")
      .text(`Source: ${data.sourceLabel}${when ? "  ·  generated " + when : ""}`);
  }

  const simulation = d3.forceSimulation(data.nodes)
    .force("link", d3.forceLink(data.links).id(d => d.id).distance(220))
    .force("charge", d3.forceManyBody().strength(-1200))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("x", d3.forceX(width / 2).strength(0.03))
    .force("y", d3.forceY(height / 2).strength(0.03));

  const link = svg.append("g").selectAll("line")
    .data(data.links.filter(d => !riskEdgeKeys.has(`${idOf(d.source)}->${idOf(d.target)}`)))
    .join("line")
    .attr("stroke", "#aaaaaa")
    .attr("stroke-width", 1)
    .attr("stroke-opacity", 0.4)
    .attr("marker-end", "url(#arrow)")
    .on("mouseover", (event, d) => {
      const src = typeof d.source === "object" ? d.source.id : d.source;
      const tgt = typeof d.target === "object" ? d.target.id : d.target;
      tooltip.style("display", "block")
        .html(`<b>${escapeHtml(src)} → ${escapeHtml(tgt)}</b><br>
               CVE: ${escapeHtml(d.cve)}<br>
               Service: ${escapeHtml(d.service)}:${escapeHtml(d.port)}<br>
               Weight: ${escapeHtml(d.weight)}`);
    })
    .on("mousemove", event => {
      tooltip.style("left", (event.pageX + 12) + "px")
             .style("top",  (event.pageY - 28) + "px");
    })
    .on("mouseout", () => tooltip.style("display", "none"));

  const node = svg.append("g").selectAll("g")
    .data(data.nodes)
    .join("g")
    .attr("class", "node")
    .call(d3.drag()
      .on("start", (event, d) => {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      })
      .on("drag", (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on("end", (event, d) => {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null; d.fy = null;
      }))
    .on("mouseover", (event, d) => {
      const vulns = d.vulns
        ? d.vulns.map(v =>
            `<br>• ${escapeHtml(v.cve)} — CVSS ${escapeHtml(v.cvss)}, p=${escapeHtml((v.p_exploit ?? 0).toFixed(3))}`
            + `${v.in_kev ? ' <span style="color:#ff6b6b">[KEV]</span>' : ""}`
            + ` — ${escapeHtml(v.service)}:${escapeHtml(v.port)}`
          ).join("")
        : "";
      const kev = d.in_kev ? ' <span style="color:#ff6b6b">[KEV]</span>' : "";
      const zone = d.zone ? `<br>Zone: ${escapeHtml(d.zone)}` : "";
      const jewel = d.is_crown_jewel ? '<br><b style="color:#ffd166">crown jewel</b>' : "";
      tooltip.style("display", "block")
        .html(`<b>${escapeHtml(d.hostname)}</b> (${escapeHtml(d.id)})${kev}${jewel}${zone}<br>
               P(exploit): ${escapeHtml((d.max_p_exploit ?? 0).toFixed(3))}
               &nbsp;·&nbsp; Max CVSS: ${escapeHtml(d.max_cvss)}${vulns}`);
    })
    .on("mousemove", event => {
      tooltip.style("left", (event.pageX + 12) + "px")
             .style("top",  (event.pageY - 28) + "px");
    })
    .on("mouseout", () => tooltip.style("display", "none"));

  node.append("circle")
    .attr("r", d => 10 + (d.max_p_exploit ?? 0) * 20)
    .attr("fill", d => riskColor(d.max_p_exploit))
    .attr("stroke", d => d.in_kev ? "#ff6b6b" : "none")
    .attr("stroke-width", d => d.in_kev ? 3 : 0);

  // Label below the circle at one fixed, comfortable size for every node —
  // cramming text inside the circle meant shrinking it to the point of being
  // unreadable on small (low-CVSS) nodes. A light truncation cap still
  // applies for extreme outliers so one long hostname can't visually run
  // into neighboring nodes; the tooltip always shows the full name.
  node.append("text")
    .attr("class", "node-label")
    .attr("text-anchor", "middle")
    .attr("y", d => 10 + (d.max_p_exploit ?? 0) * 20 + 16)
    .text(d => d.hostname.length > 24 ? d.hostname.slice(0, 23) + "…" : d.hostname);

  simulation.on("tick", () => {
    link
      .attr("x1", d => d.source.x)
      .attr("y1", d => d.source.y)
      .attr("x2", d => {
        const dx = d.target.x - d.source.x;
        const dy = d.target.y - d.source.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const r = 10 + (d.target.max_p_exploit ?? 0) * 20;
        return d.target.x - (dx / dist) * (r + 4);
      })
      .attr("y2", d => {
        const dx = d.target.x - d.source.x;
        const dy = d.target.y - d.source.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const r = 10 + (d.target.max_p_exploit ?? 0) * 20;
        return d.target.y - (dy / dist) * (r + 4);
      });

    node.attr("transform", d => `translate(${d.x},${d.y})`);

    // Redraw red path on every tick
    const nodeById = Object.fromEntries(data.nodes.map(n => [n.id, n]));
    riskLayer.selectAll("line").remove();
    riskNodeIds.slice(0, -1).forEach((id, i) => {
      const s = nodeById[id];
      const t = nodeById[riskNodeIds[i + 1]];
      if (!s || !t) return;  // guard against a stale/hand-edited riskPath referencing a missing node
      const dx = t.x - s.x;
      const dy = t.y - s.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const r = 10 + (t.max_p_exploit ?? 0) * 20;
      riskLayer.append("line")
        .attr("x1", s.x).attr("y1", s.y)
        .attr("x2", t.x - (dx / dist) * (r + 4))
        .attr("y2", t.y - (dy / dist) * (r + 4))
        .attr("stroke", "red")
        .attr("stroke-width", 3)
        .attr("marker-end", "url(#arrow-red)");
    });
  });
});
</script>
</body>
</html>
